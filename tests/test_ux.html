<!DOCTYPE html>
<html>

<!-- ---------------------------------------------------- -->
<!-- ---------------------------------------------------- -->
<head>
<meta charset="utf-8"/>
<title>Tests - Beacon</title>

<!-- ---------------------------------------------------- -->
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  font-size: 2em;
  color: #000000;
}

#texto {
  margin: 0;
}

#salida {
  font-size: 0.4em;
  margin-top: 2em;
}
</style>

<!-- ---------------------------------------------------- -->
<!-- ---------------------------------------------------- -->
<!-- la fake real, que cada test sustituye por un doble -->
<script src="../ux/logicaFake/consultarUltimoCodigo.js"></script>

<!-- ---------------------------------------------------- -->
<script>
// ---------------------------------------------------
//
// mismo pintar() y cargarAplicacion() que ux/Aplicacion.html
// (en file:// un documento no puede leer otro, asi que el
// test replica la pagina para poder manejarla)
//
// ---------------------------------------------------
function pintar( texto ) {
  var elemento = document.getElementById( "texto" );
  if ( ! elemento ) {
    return false;
  }
  elemento.innerHTML = texto;
  return true;
}

// ---------------------------------------------------
//
// -> cargarAplicacion() -> bool
//   (consulta el último código y lo pinta en pantalla)
//
// ---------------------------------------------------
function cargarAplicacion() {
  pintar( "Consultando..." );
  consultarUltimoCodigo( function( err, res ) {
    if ( err ) {
      pintar( "No hay código" );
      return;
    }
    pintar( "Código: " + res.valor );
  } );
  return true;
}
</script>

</head>

<!-- ---------------------------------------------------- -->
<!-- ---------------------------------------------------- -->
<body>

<p id="texto"></p>
<pre id="salida"></pre>

<!-- ---------------------------------------------------- -->
<!-- ---------------------------------------------------- -->
<script>
// ---------------------------------------------------
//
// dobles de la fake: respuestas preparadas, sin red
//
// ---------------------------------------------------
function dobleConCodigo( valor ) {
  return function( cb ) {
    cb( null, { valor: valor, fecha: "2026-01-01 10:00:00", error: 0 } );
  };
}

function dobleSinCodigo( texto ) {
  return function( cb ) {
    cb( texto, null );
  };
}

function doblePendiente() {
  return function( cb ) {
    // no responde todavia: la pantalla debe quedarse como esta
  };
}

// ---------------------------------------------------
//
// bool, Texto, Texto -> comprobar() -> void
//
// imprime OK:/FALLO: de cada test y lleva el recuento
//
// ---------------------------------------------------
var aciertos = 0;
var total = 0;

function comprobar( cond, nombre, motivo ) {
  total++;
  var linea;
  if ( cond ) {
    aciertos++;
    linea = "OK: " + nombre;
  } else {
    linea = "FALLO: " + nombre + " - " + motivo;
  }
  document.getElementById( "salida" ).innerHTML += linea + "\n";
  console.log( linea );
}

function textoEnPantalla() {
  return document.getElementById( "texto" ).innerHTML;
}

// ---------------------------------------------------
//
// tests
//
// ---------------------------------------------------
function ejecutarTests() {

  if ( typeof consultarUltimoCodigo !== "function"
    || typeof cargarAplicacion !== "function" ) {
    comprobar( false, "carga de la fake y de la pagina", "falta algun script" );
    terminar();
    return;
  }

  // 1- estado inicial: antes de la respuesta aparece Consultando...
  consultarUltimoCodigo = doblePendiente();
  cargarAplicacion();
  comprobar(
    textoEnPantalla() === "Consultando...",
    "estado inicial: al cargar, antes de la respuesta, aparece Consultando...",
    "aparece " + JSON.stringify( textoEnPantalla() )
  );

  // 2- pintado del codigo: la fake devuelve el codigo y se muestra
  consultarUltimoCodigo = dobleConCodigo( 1234 );
  cargarAplicacion();
  comprobar(
    textoEnPantalla() === "Código: 1234",
    "pintado del codigo: aparece Código: 1234",
    "aparece " + JSON.stringify( textoEnPantalla() )
  );

  // 3- ausencia de codigo: la fake devuelve error y se muestra No hay codigo
  consultarUltimoCodigo = dobleSinCodigo( "no hay códigos guardados" );
  cargarAplicacion();
  comprobar(
    textoEnPantalla() === "No hay código",
    "ausencia de codigo: aparece No hay código",
    "aparece " + JSON.stringify( textoEnPantalla() )
  );

  // 4- el texto esta centrado horizontal y verticalmente
  var estilos = getComputedStyle( document.body );
  var centrado = estilos.display === "flex"
    && estilos.alignItems === "center"
    && estilos.justifyContent === "center";
  comprobar(
    centrado,
    "el texto esta centrado horizontal y verticalmente",
    "display=" + estilos.display
      + " alignItems=" + estilos.alignItems
      + " justifyContent=" + estilos.justifyContent
  );

  terminar();
}

function terminar() {
  var recuento = aciertos + "/" + total + " tests correctos";
  document.getElementById( "salida" ).innerHTML += recuento + "\n";
  console.log( recuento );
}

window.onload = ejecutarTests;
</script>

</body>
</html>
